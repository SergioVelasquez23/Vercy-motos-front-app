<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vercy Motos">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/logo.png" />
  <link rel="shortcut icon" href="icons/logo.png" />

  <title>Vercy Motos - Sistema de Gestión</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
      var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    // Desregistrar cualquier service worker antiguo para evitar que sirva
    // archivos cacheados al reabrir la pestaña (causa del bug con Ctrl+F5).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
    }

    window.addEventListener('load', function (ev) {
      // Sin service worker: siempre carga archivos frescos del servidor.
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <div id="loading">
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #1A1A1A;
        color: #FFFFFF;
      }

      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #313131;
        border-top: 5px solid #FF6B00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Asegura que no haya reglas globales que pongan texto gris */
      a,
      p,
      span,
      div,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: inherit;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>
</body>

</html>
